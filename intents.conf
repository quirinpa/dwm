# ~/.config/dwm/intents.conf — Declarative Semantic Desktop Intents (axil-auren /v1/systemone)
# Format:
#   intent_id | command | exemplar 1 ; exemplar 2 ; exemplar 3 (EN & PT supported)
#
# Users can add or edit any line below without recompiling dwm.
# Settings in ~/.Xresources:
#   dwm.auren.url:       http://localhost:4242/v1/systemone
#   dwm.auren.model:     bge-base
#   dwm.auren.threshold: 0.68

# --- Keyboard Layout ---
kbd_toggle      | dwm-ctl kbd-toggle              | switch keyboard layout; toggle keyboard; change language to portuguese or english; mudar teclado; mudar idioma do teclado

# --- Workspaces / Tags (View) ---
view_1          | dwm-msg view 1                  | switch to workspace 1; go to workspace 1; workspace 1; go to tag 1; desktop 1; ir para o ecrã 1; vai para o workspace 1
view_2          | dwm-msg view 2                  | switch to workspace 2; go to workspace 2; workspace 2; go to tag 2; desktop 2; ir para o ecrã 2; vai para o workspace 2
view_3          | dwm-msg view 3                  | switch to workspace 3; go to workspace 3; workspace 3; go to tag 3; desktop 3; ir para o ecrã 3; vai para o workspace 3
view_4          | dwm-msg view 4                  | switch to workspace 4; go to workspace 4; workspace 4; go to tag 4; desktop 4; ir para o ecrã 4; vai para o workspace 4
view_5          | dwm-msg view 5                  | switch to workspace 5; go to workspace 5; workspace 5; go to tag 5; desktop 5; ir para o ecrã 5; vai para o workspace 5
view_all        | dwm-msg view 0                  | show all workspaces; view all tags; mostrar todos os ecrãs

# --- Move Window to Workspace / Tag ---
tag_1           | dwm-msg tag 1                   | move window to workspace 1; send to tag 1; muda esta janela para o ecrã 1
tag_2           | dwm-msg tag 2                   | move window to workspace 2; send to tag 2; muda esta janela para o ecrã 2
tag_3           | dwm-msg tag 3                   | move window to workspace 3; send to tag 3; muda esta janela para o ecrã 3
tag_4           | dwm-msg tag 4                   | move window to workspace 4; send to tag 4; muda esta janela para o ecrã 4
tag_5           | dwm-msg tag 5                   | move window to workspace 5; send to tag 5; muda esta janela para o ecrã 5

# --- Window Management & Layouts ---
fullscreen      | dwm-msg togglefullscreen        | toggle fullscreen; maximize window; full screen mode; ecrã inteiro; maximizar janela
floating        | dwm-msg togglefloating          | toggle floating window; float this window; tile this window; janela flutuante
zoom_master     | dwm-msg zoom                    | swap with master window; promote window to master; promover janela principal
focus_next      | dwm-msg focusstack next         | focus next window; cycle window focus; próxima janela
focus_prev      | dwm-msg focusstack prev         | focus previous window; janela anterior
close_win       | dwm-msg killclient              | close this window; kill window; fechar janela
layout_tile     | dwm-msg layout tile             | tiled layout; tiling mode; modo mosaico
layout_monocle  | dwm-msg layout monocle          | monocle layout; stacked single window mode; modo monóculo
toggle_bar      | dwm-msg togglebar               | hide status bar; toggle top bar; show bar; esconder barra

# --- Focus Specific Applications ---
focus_browser   | dwm-msg focus-class firefox     | focus browser; switch to firefox; open web browser; focar navegador firefox
focus_terminal  | dwm-msg focus-class ghostty     | focus terminal; switch to ghostty shell; ir para o terminal
open_terminal   | ghostty                         | open new terminal; launch ghostty; abrir novo terminal

# --- Configurable Parametric Actions ({arg} templates) ---
open_target     | dwm-act open "{arg}"            | open {arg}; launch {arg}; start {arg}; bring up {arg}; pull up {arg}; abrir {arg}; iniciar {arg}
play_target     | dwm-act play "{arg}"            | play {arg}; put on {arg}; put up {arg}; listen to {arg}; tocar {arg}; ouvir {arg}
focus_target    | dwm-act focus "{arg}"           | switch to {arg}; focus {arg}; go to {arg}; take me to {arg}; mudar para {arg}; ir para {arg}; focar {arg}
click_target    | dwm-act click "{arg}"           | click on {arg}; click {arg}; tap on {arg}; left click {arg}; clicar em {arg}; clica no {arg}; clica na {arg}
rclick_target   | dwm-act right_click "{arg}"     | right click on {arg}; right click {arg}; clique direito em {arg}; botão direito em {arg}
dclick_target   | dwm-act double_click "{arg}"    | double click on {arg}; double click {arg}; duplo clique em {arg}
type_enter      | dwm-act type_enter "{arg}"      | type {arg} and press enter; write {arg} and press enter; type {arg} and hit enter; write {arg} and hit enter; search for {arg}; look up {arg}; pesquisar por {arg}; procurar por {arg}
type_text       | dwm-act type "{arg}"            | type {arg}; write {arg}; dictate {arg}; input {arg}; escreve {arg}; digita {arg}

# --- Browser, Keyboard & Mouse Actions (dwm-act) ---
new_tab         | dwm-act key ctrl+t              | open a new tab; new browser tab; abrir novo separador; nova aba
close_tab       | dwm-act key ctrl+w              | close this tab; close browser tab; fechar separador; fechar aba
next_tab        | dwm-act key ctrl+Tab            | next tab; switch to next tab; próximo separador
prev_tab        | dwm-act key ctrl+shift+Tab      | previous tab; switch to previous tab; separador anterior
reload_page     | dwm-act key ctrl+r              | reload page; refresh browser; recarregar página; atualizar página
address_bar     | dwm-act key ctrl+l              | focus address bar; select url bar; barra de endereço
press_enter     | dwm-act key Return              | press enter; hit return; carrega no enter
press_escape    | dwm-act key Escape              | press escape; hit escape; tecla escape
click_center    | dwm-act click center            | click center of window; click in the middle; clicar no centro da janela
scroll_down     | dwm-act scroll down 5           | scroll down; page down; rolar para baixo
scroll_up       | dwm-act scroll up 5             | scroll up; page up; rolar para cima

# --- Jarvis Pi Session Controls (tmux) ---
pi_show         | dwm-jarvis-pi show              | show pi; open pi; show pi session; open pi terminal; show jarvis session; attach pi; mostrar pi; abrir pi
pi_stop         | dwm-jarvis-pi stop              | stop pi; cancel pi; abort pi; stop command; cancel command; parar pi; cancelar pi
pi_reset        | dwm-jarvis-pi reset             | reset pi; new pi session; clear pi session; restart pi; reiniciar pi; nova sessão pi

# --- Media Playback Controls (MPRIS / Browser) ---
media_pause     | dwm-act media pause             | pause music; pause video; pause playback; stop the music; pausar música; parar música
media_resume    | dwm-act media play              | resume music; resume playback; continue playing; unpause video; continuar música
media_next      | dwm-act media next              | next song; skip track; next video; próxima música; passar à frente
media_prev      | dwm-act media prev              | previous song; previous track; música anterior

# --- Audio, Brightness, Calendar, System ---
vol_mute        | dwm-ctl vol-mute                | mute audio; silence speaker; toggle mute; tirar o som; silenciar áudio
vol_up          | dwm-ctl vol-up                  | increase volume; louder; volume up; aumentar o som; subir volume
vol_down        | dwm-ctl vol-down                | decrease volume; quieter; volume down; baixar o som; diminuir volume
bri_up          | dwm-ctl bri-up                  | increase screen brightness; brighter display; aumentar brilho do ecrã
bri_down        | dwm-ctl bri-down                | decrease screen brightness; dim display; diminuir brilho do ecrã
cal_popup       | dwm-cal popup                   | show calendar; upcoming meetings; agenda for today; mostrar calendário e agenda
cal_open        | dwm-cal open                    | open full calendar ikhal; abrir calendário completo
wifi_menu       | dwm-net wifi                    | wifi network settings; connect to wifi; rede wifi
battery_status  | dwm-ctl battery-info            | check battery status; power draw and health; estado da bateria
reload_theme    | dwm-ctl reload-xrdb             | reload xresources theme; refresh colors; recarregar tema e cores
screenshot_area | dwm-shot select                 | take screenshot of area; select region screenshot; captura de ecrã parcial
screenshot_full | dwm-shot full                   | take full screen screenshot; captura de ecrã inteiro
lock_screen     | slock                           | lock screen; lock computer; bloquear ecrã
