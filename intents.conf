# ~/.config/dwm/intents.conf — Declarative Desktop Intents (dwm-auren + dwm-act)
# Format:
#   intent_id | command | exemplar 1 ; exemplar 2 ; exemplar 3
#
# Users can add or edit any line below without recompiling dwm.
# Settings in ~/.Xresources:
#   dwm.auren.url:       http://localhost:4242/v1/systemone
#   dwm.auren.model:     bge-base
#   dwm.auren.threshold: 0.68
#   dwm.auren.inference: false   (opt-in neural embedding/LLM fallback)

# --- Keyboard Layout ---
kbd_toggle      | dwm-ctl kbd-toggle              | switch keyboard layout; toggle keyboard; change keyboard language

# --- Workspaces / Tags (View) ---
view_1          | dwm-msg view 1                  | switch to workspace 1; go to workspace 1; workspace 1; go to tag 1; desktop 1
view_2          | dwm-msg view 2                  | switch to workspace 2; go to workspace 2; workspace 2; go to tag 2; desktop 2
view_3          | dwm-msg view 3                  | switch to workspace 3; go to workspace 3; workspace 3; go to tag 3; desktop 3
view_4          | dwm-msg view 4                  | switch to workspace 4; go to workspace 4; workspace 4; go to tag 4; desktop 4
view_5          | dwm-msg view 5                  | switch to workspace 5; go to workspace 5; workspace 5; go to tag 5; desktop 5
view_all        | dwm-msg view 0                  | show all workspaces; view all tags; show all tags

# --- Move Window to Workspace / Tag ---
tag_1           | dwm-msg tag 1                   | move window to workspace 1; move this window to workspace 1; put this window on workspace 1; send to tag 1
tag_2           | dwm-msg tag 2                   | move window to workspace 2; move this window to workspace 2; put this window on workspace 2; send to tag 2
tag_3           | dwm-msg tag 3                   | move window to workspace 3; move this window to workspace 3; put this window on workspace 3; send to tag 3
tag_4           | dwm-msg tag 4                   | move window to workspace 4; move this window to workspace 4; put this window on workspace 4; send to tag 4
tag_5           | dwm-msg tag 5                   | move window to workspace 5; move this window to workspace 5; put this window on workspace 5; send to tag 5
tag_other_1     | dwm-act tag_other 1             | move the other window to workspace 1; send the other window to workspace 1; move other window to tag 1; put the other window on workspace 1
tag_other_2     | dwm-act tag_other 2             | move the other window to workspace 2; send the other window to workspace 2; move other window to tag 2; put the other window on workspace 2
tag_other_3     | dwm-act tag_other 3             | move the other window to workspace 3; send the other window to workspace 3; move other window to tag 3; put the other window on workspace 3
tag_other_4     | dwm-act tag_other 4             | move the other window to workspace 4; send the other window to workspace 4; move other window to tag 4; put the other window on workspace 4
tag_other_5     | dwm-act tag_other 5             | move the other window to workspace 5; send the other window to workspace 5; move other window to tag 5; put the other window on workspace 5
close_other     | dwm-act close_other             | close the other window; kill the other window
focus_other     | dwm-act focus_other             | focus the other window; switch to the other window; go to the other window
voice_undo      | dwm-act undo                    | scratch that; undo; undo that; undo last command; revert that

# --- Window Management & Layouts ---
fullscreen      | dwm-msg togglefullscreen        | toggle fullscreen; maximize window; full screen mode; make this window full screen; make it fullscreen; make it full screen
floating        | dwm-msg togglefloating          | toggle floating window; float this window; tile this window
zoom_master     | dwm-msg zoom                    | swap with master window; promote window to master; zoom window
focus_next      | dwm-msg focusstack next         | focus next window; cycle window focus; next window
focus_prev      | dwm-msg focusstack prev         | focus previous window; previous window
close_win       | dwm-msg killclient              | close this window; kill window; close window
layout_tile     | dwm-msg layout tile             | tiled layout; tiling mode
layout_monocle  | dwm-msg layout monocle          | monocle layout; stacked single window mode
toggle_bar      | dwm-msg togglebar               | hide status bar; toggle top bar; show bar; toggle status bar

# --- Focus Specific Applications ---
focus_browser   | dwm-msg focus-class firefox     | focus browser; switch to firefox; open web browser; go to browser
focus_terminal  | dwm-msg focus-class st-256color | focus terminal; switch to terminal; go to terminal; focus st; switch to st; focus xterm; switch to xterm
open_terminal   | st                              | open terminal; open a terminal; open a new terminal; open up a new terminal; open up a terminal; open new terminal; launch terminal; start terminal; open st; launch st; open xterm; launch xterm

# --- Declarative Constituent Span Roles (Semantic Frame Grammar, zero-regex) ---
@target_self    | SELF                            | into this window; in this window; on this window; in the current window; into the current window; into the active window; in the active window; right here; here; into this terminal; in this terminal
@target_other   | OTHER                           | into the other window; in the other window; to the other window; on the other window; into other window; in other window; to other window; in the other terminal
@submit_tail    | SUBMIT                          | and press enter; and hit enter; and hit return; then press enter; then hit enter
@clause_sep     | SEP                             | and then; then; and

# --- Configurable Parametric Actions ({arg} templates) ---
pull_target     | dwm-act pull "{arg}"            | pull {arg} here; bring {arg} here; pull {arg} to this workspace; bring {arg} to this workspace; summon {arg}; pull {arg}; bring {arg}
search_web      | dwm-act search "{arg}"          | search google for {arg}; google {arg}; search the web for {arg}; search for {arg} on google
pi_ask          | dwm-act pi "{arg}"              | ask pi to {arg}; ask pi {arg}; tell pi to {arg}
play_target     | dwm-act play "{arg}"            | play some {arg}; play {arg}; open up some {arg}; open some {arg}; put on some {arg}; put up some {arg}; put on {arg}; put up {arg}; listen to some {arg}; listen to {arg}; let's listen to {arg}; lets listen to {arg}
open_target     | dwm-act open "{arg}"            | open up {arg}; open {arg}; launch {arg}; start {arg}; bring up {arg}; pull up {arg}
focus_target    | dwm-act focus "{arg}"           | switch to {arg}; focus {arg}; go to {arg}; take me to {arg}
click_target    | dwm-act click "{arg}"           | click on {arg}; click {arg}; tap on {arg}; left click {arg}
rclick_target   | dwm-act right_click "{arg}"     | right click on {arg}; right click {arg}
dclick_target   | dwm-act double_click "{arg}"    | double click on {arg}; double click {arg}
type_enter_other| dwm-act type_enter_other "{arg}"| type in {arg} in the other window and press enter; type {arg} in the other window and press enter; write in {arg} in the other window and press enter; write {arg} in the other window and press enter
type_other      | dwm-act type_other "{arg}"      | type in {arg} into the other window; type in {arg} in the other window; type {arg} into the other window; type {arg} in the other window; write in {arg} in the other window; write {arg} in the other window
type_enter      | dwm-act type_enter "{arg}"      | type in {arg} and press enter; type out {arg} and press enter; type {arg} and press enter; write in {arg} and press enter; write down {arg} and press enter; write {arg} and press enter; type in {arg} and hit enter; type {arg} and hit enter; write {arg} and hit enter; search for {arg}; look up {arg}
type_text       | dwm-act type "{arg}"            | type in {arg}; type out {arg}; type {arg}; write in {arg}; write down {arg}; write out {arg}; write {arg}; dictate {arg}; input {arg}; enter in {arg}; enter {arg}; put in {arg}

# --- Context-Sensitive Application Actions (@terminal vs @browser) ---
clear_line@terminal  | dwm-act key ctrl+u              | clear the line; clear line; erase the line; erase line; wipe the line; wipe line; discard line; kill line
clear_line@browser   | dwm-act key ctrl+a BackSpace    | clear the line; clear line; erase the line; erase line; wipe the line; wipe line
del_word@terminal    | dwm-act key ctrl+w              | delete word; delete the last word; delete last word; delete previous word; erase word; erase last word
del_word@browser     | dwm-act key ctrl+BackSpace      | delete word; delete the last word; delete last word; delete previous word; erase word; erase last word
line_start@terminal  | dwm-act key ctrl+a              | jump to start of line; go to start of line; beginning of line; start of the line; jump to the beginning of the line
line_end@terminal    | dwm-act key ctrl+e              | jump to end of line; go to end of line; end of line; end of the line; jump to the end of the line
clear_scr@terminal   | dwm-act key ctrl+l              | clear screen; clear the screen; clear terminal; clean terminal; reset screen
interrupt@terminal   | dwm-act key ctrl+c              | interrupt; interrupt process; cancel process; stop process; kill current command; send ctrl c; press ctrl c
eof_shell@terminal   | dwm-act key ctrl+d              | send eof; exit shell; close shell
hist_search@terminal | dwm-act key ctrl+r              | reverse search; search command history; search history
copy_sel@terminal    | dwm-act key ctrl+shift+c        | copy selection; copy that; copy text
copy_sel@browser     | dwm-act key ctrl+c              | copy selection; copy that; copy text
paste_clip@terminal  | dwm-act key ctrl+shift+v        | paste; paste clipboard; paste that; paste text
paste_clip@browser   | dwm-act key ctrl+v              | paste; paste clipboard; paste that; paste text
reopen_tab@browser   | dwm-act key ctrl+shift+t        | reopen closed tab; reopen the closed tab; restore closed tab; restore tab; undo close tab
dev_tools@browser    | dwm-act key ctrl+shift+i        | open developer tools; developer tools; inspect element; toggle devtools
find_page@browser    | dwm-act key ctrl+f              | find on page; search on page; find in page
mute_tab@browser     | dwm-act key ctrl+m              | mute this tab; mute browser tab; unmute tab; toggle tab mute

# --- Browser, Keyboard & Mouse Actions (dwm-act) ---
new_tab         | dwm-act key ctrl+t              | open a new tab; open a new browser tab; new browser tab; new tab
close_tab       | dwm-act key ctrl+w              | close this tab; close browser tab; close tab
next_tab        | dwm-act key ctrl+Tab            | next tab; switch to next tab
prev_tab        | dwm-act key ctrl+shift+Tab      | previous tab; switch to previous tab
reload_page     | dwm-act key ctrl+r              | reload page; refresh browser; refresh page
address_bar     | dwm-act key ctrl+l              | focus address bar; select url bar
press_enter     | dwm-act key Return              | press enter; hit return; hit enter
press_escape    | dwm-act key Escape              | press escape; hit escape
click_center    | dwm-act click center            | click center of window; click in the middle
scroll_down     | dwm-act scroll down 5           | scroll down; page down
scroll_up       | dwm-act scroll up 5             | scroll up; page up

# --- Jarvis Pi Session Controls (tmux) ---
pi_show         | dwm-jarvis-pi show              | show pi; open pi; show pi session; open pi terminal; show jarvis session; attach pi
pi_stop         | dwm-jarvis-pi stop              | stop pi; cancel pi; abort pi; stop command; cancel command
pi_reset        | dwm-jarvis-pi reset             | reset pi; new pi session; clear pi session; restart pi

# --- Jarvis Lockdown & Window Manager Instructions ---
jarvis_lockdown | dwm-voice lockdown              | lockdown; lock down; jarvis lockdown; enter lockdown; turn off jarvis; stop listening; disable jarvis; go to sleep
wm_help         | dwm-help show                   | show shortcuts; keyboard shortcuts; window manager help; window manager instructions; how do I use my window manager; how to use dwm; show help; help me use my window manager
wm_how_to       | dwm-help ask "{arg}"            | how do I {arg}; how can I {arg}; how to {arg}; what is the shortcut to {arg}; what is the shortcut for {arg}; what is the keybinding for {arg}; instructions on how to {arg}; instructions for {arg}; tell me how to {arg}

# --- Screen & Audio Recording (dwm-rec / dwm-act) ---
record_start    | dwm-act record start            | start recording; start recording screen; start recording my screen; start recording my screen with audio; start recording my screen and audio; start recording screen with audio; record my screen; record my screen with audio; record my screen and audio; record screen with audio; start screen recording; begin recording
record_silent   | dwm-act record screen           | record screen without audio; record screen only; start silent screen recording; record my screen without audio
record_stop     | dwm-act record stop             | stop recording; stop screen recording; finish recording; end recording; save recording; stop recording my screen
record_toggle   | dwm-act record toggle           | toggle recording; toggle screen recording
wait_sec        | dwm-act wait_sec "{arg}"        | wait {arg} seconds; wait {arg} second; wait for {arg} seconds; pause for {arg} seconds

# --- Media Playback Controls (MPRIS / Browser) ---
media_pause     | dwm-act media pause             | pause music; pause the music; pause video; pause playback; stop the music
media_resume    | dwm-act media play              | resume music; resume playback; continue playing; unpause video
media_next      | dwm-act media next              | next song; skip track; next video; next track
media_prev      | dwm-act media prev              | previous song; previous track

# --- Audio, Brightness, Calendar, System ---
vol_mute        | dwm-ctl vol-mute                | mute audio; mute volume; silence speaker; toggle mute
vol_up          | dwm-ctl vol-up                  | increase volume; louder; volume up; turn up the volume; raise volume
vol_down        | dwm-ctl vol-down                | decrease volume; quieter; volume down; turn down the volume; lower volume
bri_up          | dwm-ctl bri-up                  | increase screen brightness; brighter display; brightness up
bri_down        | dwm-ctl bri-down                | decrease screen brightness; dim display; brightness down
cal_popup       | dwm-cal popup                   | show calendar; upcoming meetings; agenda for today; show me my agenda for today
cal_open        | dwm-cal open                    | open full calendar ikhal; open calendar
wifi_menu       | dwm-net wifi                    | wifi network settings; connect to wifi
battery_status  | dwm-ctl battery-info            | check battery status; power draw and health
reload_theme    | dwm-ctl reload-xrdb             | reload xresources theme; refresh colors
lock_screen     | slock                           | lock screen; lock computer; lock workstation
take_screenshot | dwm-shot area                   | take a screenshot; capture screen area
full_screenshot | dwm-shot full                   | full screen screenshot; capture entire display
audio_outputs   | dwm-ctl audio-out               | switch audio output; headphones or speakers
power_menu      | dwm-ctl power                   | power menu; suspend reboot or shutdown
control_center  | dwm-ctl                         | open control center; system settings menu
sys_monitor     | dwm-ctl sys-monitor             | open system monitor; show memory usage; show running processes; open process monitor; open top; show what is using memory; check memory usage
